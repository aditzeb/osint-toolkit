/* link chart */
function renderChart(){
  const d = state.case, el = $("#view-chart");
  if (!d) return;
  const accounts = allAccounts(d);
  const order = {linked: 0, open: 1, excluded: 2};
  const ranked = accounts.map(a => ({a, st: accountStatus(d, a)})).sort((x, y) => order[x.st] - order[y.st]);
  const excludedAll = ranked.filter(x => x.st === "excluded");
  // Many ruled-out accounts collapse into one group node instead of crowding the chart.
  const grouped = excludedAll.length > 3;
  const accs = (grouped ? ranked.filter(x => x.st !== "excluded") : ranked).slice(0, 22);
  if (grouped) accs.push({a: {account_id: "excluded-group", ref: "", platform: `${excludedAll.length} excluded`}, st: "excluded", group: true});
  const mentionSources = new Set((d.evidence_records || []).filter(r => r.supports && r.dependence?.startsWith("src_")).map(r => r.dependence));
  const conns = d.connections || [];
  const ledSources = new Set(conns.filter(c => c.kind === "led_to").map(c => c.a));
  const srcs = (d.sources || []).filter(s => mentionSources.has(s.id) || ledSources.has(s.id) || s.extra?.exact_name_result)
    .slice(0, 14);
  if (!accs.length && !srcs.length){ el.innerHTML = `<div class="empty">The chart fills in as pages mentioning the subject and accounts are found.</div>`; return; }

  const W = Math.max(860, (el.clientWidth || $("#viewport").clientWidth - 44));
  const rowH = 62;
  const rightCols = accs.length > 11 ? 2 : 1;
  const perCol = Math.ceil(accs.length / rightCols) || 1;
  const H = Math.max(440, 90 + Math.max(srcs.length, perCol) * rowH);
  const cx = Math.round(W * 0.42), cy = Math.round(H / 2);
  const pos = new Map();
  pos.set("subject", {x: cx, y: cy});
  srcs.forEach((s, i) => pos.set(s.id, {x: Math.round(Math.min(280, W * 0.22)), y: Math.round(H / 2 + (i - (srcs.length - 1) / 2) * rowH)}));
  accs.forEach(({a}, i) => {
    const colIndex = Math.floor(i / perCol), row = i % perCol;
    const n = Math.min(perCol, accs.length - colIndex * perCol);
    pos.set(a.account_id, {x: rightCols === 2 ? Math.round(W * (0.7 + colIndex * 0.19)) : Math.round(W * 0.78), y: Math.round(H / 2 + (row - (n - 1) / 2) * rowH)});
  });

  const edges = [];
  for (const {a, st} of accs) edges.push({from: "subject", to: a.account_id, cls: st});
  for (const s of srcs) if (mentionSources.has(s.id)) edges.push({from: s.id, to: "subject", cls: "mentions", label: "mentions"});
  const byRef = new Map(accounts.map(a => [a.ref, a]));
  const idOf = ref => String(ref).startsWith("src_") ? ref : byRef.get(ref)?.account_id;
  const LABELS = {links_to: "links to", shared_site: "same site", same_handle: "same handle", same_image_url: "same image", led_to: "led to"};
  const CLUES = new Set(["same_handle", "same_image_url"]);
  for (const c of conns){
    const f = idOf(c.a), t = idOf(c.b);
    if (!f || !t || !pos.has(f) || !pos.has(t) || c.excluded_side) continue;
    edges.push({from: f, to: t, cls: c.kind, label: CLUES.has(c.kind) ? "" : (LABELS[c.kind] || c.kind), arc: true});
  }

  const firstDraw = state.seenNodes.size === 0;
  const isNew = id => !state.seenNodes.has(id);
  const curve = (p, q, arc) => {
    // Same column: loop out on the left, away from the labels on the right.
    if (Math.abs(p.x - q.x) < 40){ const bx = Math.min(p.x, q.x) - 46 - Math.abs(p.y - q.y) * 0.12; return `M${p.x - 17},${p.y} C${bx},${p.y} ${bx},${q.y} ${q.x - 17},${q.y}`; }
    if (arc){ const lift = Math.min(p.y, q.y) - 70 - Math.abs(p.x - q.x) * 0.08; return `M${p.x},${p.y} Q${(p.x + q.x) / 2},${lift} ${q.x},${q.y}`; }
    const mx = (p.x + q.x) / 2; return `M${p.x},${p.y} C${mx},${p.y} ${mx},${q.y} ${q.x},${q.y}`;
  };
  const labelAt = (p, q, arc) => Math.abs(p.x - q.x) < 40
    ? {x: Math.min(p.x, q.x) - 50 - Math.abs(p.y - q.y) * 0.09, y: (p.y + q.y) / 2 + 3}
    : arc
    ? {x: (p.x + q.x) / 2, y: (Math.min(p.y, q.y) + (Math.min(p.y, q.y) - 70 - Math.abs(p.x - q.x) * 0.08)) / 2 - 2}
    : {x: p.x + (q.x - p.x) * 0.5, y: p.y + (q.y - p.y) * 0.5 - 5};
  let svg = `<svg id="chartSvg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Link chart">`;
  svg += `<rect class="bgfade" x="0" y="0" width="${W}" height="${H}"/>`;
  let labels = "";
  edges.forEach((e, i) => {
    const p = pos.get(e.from), q = pos.get(e.to);
    if (!p || !q) return;
    const fresh = isNew(e.from + ">" + e.to);
    const drawable = !["open", "excluded", "shared_site", "same_handle", "same_image_url"].includes(e.cls);
    // pathLength only on drawn (solid) edges: it would rescale dash patterns to solid lines.
    svg += `<path class="edge ${esc(e.cls)} ${fresh && drawable ? "draw" : ""}" data-a="${esc(e.from)}" data-b="${esc(e.to)}" ${drawable ? `pathLength="1"` : ""}
      style="${fresh ? `animation-delay:${firstDraw ? Math.min(i * 30, 500) : 0}ms` : ""}" d="${curve(p, q, e.arc)}"/>`;
    if (e.label){ const l = labelAt(p, q, e.arc);
      labels += `<text class="elabel" data-a="${esc(e.from)}" data-b="${esc(e.to)}" x="${l.x}" y="${l.y}" text-anchor="middle">${esc(e.label)}</text>`; }
  });
  svg += labels;
  // The SVG translate lives on the outer group; the CSS entry animation runs on
  // an inner group so its transform cannot override the position.
  const node = (id, cls, sel, inner, i) => `<g class="node ${cls}" data-id="${esc(id)}" data-sel="${esc(sel)}"
    transform="translate(${pos.get(id).x},${pos.get(id).y})"><g class="${isNew(id) ? "enter" : ""}"
    style="${isNew(id) ? `animation-delay:${firstDraw ? Math.min(i * 35, 500) : 0}ms;` : ""}">${inner}</g></g>`;
  srcs.forEach((s, i) => {
    const blocked = s.outcome !== "found";
    svg += node(s.id, `source ${blocked ? "blocked" : ""}`, `source:${s.id}`,
      `<path class="shape" d="M-11,-15 h15 l7,7 v23 h-22 z"/><path class="glyph" d="M4,-15 v7 h7" fill="none" stroke="var(--rule2)"/>
       <rect class="glyph" x="-6" y="-3" width="11" height="1.6"/><rect class="glyph" x="-6" y="2" width="11" height="1.6"/><rect class="glyph" x="-6" y="7" width="7" height="1.6"/>
       <text class="nm" x="-22" y="-1" text-anchor="end">${esc(clean((s.title || domain(s.url))).slice(0, 30))}</text>
       <text class="sub" x="-22" y="13" text-anchor="end">${esc(domain(s.url))}${blocked ? " · not readable" : ""}</text>`, i);
  });
  accs.forEach(({a, st, group}, i) => {
    if (group){
      svg += node(a.account_id, "account excluded group", "", `<rect class="shape" x="-17" y="-17" width="34" height="34" rx="3"/>
        <rect class="shape" x="-13" y="-21" width="34" height="34" rx="3" style="fill:none"/>
        <text x="0" y="4.5" text-anchor="middle" style="font:600 12px var(--mono);fill:var(--paper)">${excludedAll.length}</text>
        <text class="nm" x="30" y="-2">Excluded accounts</text><text class="sub" x="30" y="12">ruled out · see Summary</text>`, i + srcs.length);
      return;
    }
    const initials = (String(a.platform || "?").match(/[A-Z0-9]/g) || [String(a.platform || "?")[0]]).slice(0, 2).join("").toUpperCase();
    svg += node(a.account_id, `account ${st}`, `account:${a.ref}`,
      `<rect class="shape" x="-17" y="-17" width="34" height="34" rx="3"/>
       <text x="0" y="4.5" text-anchor="middle" style="font:600 12px var(--mono);fill:var(--paper)">${esc(initials)}</text>
       <text class="nm" x="26" y="-2">${esc(a.platform || "")} <tspan class="sub">${esc(a.ref)}</tspan></text>
       <text class="sub" x="26" y="12">${esc((a.matched_handle ? "@" + a.matched_handle : short(a.canonical_url)).slice(0, 30))}</text>`, i + srcs.length);
  });
  const subj = d.subject_status || {};
  svg += node("subject", "subject", "", `<circle class="shape" r="30"/>
    <circle class="glyph" cx="0" cy="-8" r="8"/><path class="glyph" d="M-15,17 a15,12 0 0 1 30,0 z"/>
    <text class="nm" x="0" y="52" text-anchor="middle">${esc(clean(subj.name || d.target))}</text>
    <text class="sub" x="0" y="67" text-anchor="middle">subject · ${esc(subj.status === "supported" ? "supported" : "unverified")}</text>`, 0);
  svg += `</svg>`;

  const legendLine = (cls, text) => `<span><svg width="26" height="8"><path class="edge ${cls}" d="M1,4 H25"/></svg>${text}</span>`;
  el.innerHTML = `<div class="chartbar"><span>${accs.length} account(s) · ${srcs.length} page(s) · ${edges.length} link(s)</span>
    <div class="legend">${legendLine("linked", "linked")}${legendLine("open", "open")}${legendLine("excluded", "excluded")}
      ${legendLine("mentions", "page mentions subject")}${legendLine("links_to", "published link")}${legendLine("same_handle", "clue only")}</div></div>
    <div class="chart">${svg}</div>`;

  for (const e of edges) state.seenNodes.add(e.from + ">" + e.to);
  for (const id of pos.keys()) state.seenNodes.add(id);
  const svgEl = $("#chartSvg");
  svgEl.querySelectorAll(".node").forEach(n => {
    n.addEventListener("mouseenter", () => {
      const id = n.dataset.id;
      svgEl.classList.add("focus");
      n.classList.add("hl");
      svgEl.querySelectorAll(`[data-a="${CSS.escape(id)}"],[data-b="${CSS.escape(id)}"]`).forEach(x => {
        x.classList.add("hl");
        const other = x.dataset.a === id ? x.dataset.b : x.dataset.a;
        svgEl.querySelector(`.node[data-id="${CSS.escape(other)}"]`)?.classList.add("hl");
      });
    });
    n.addEventListener("mouseleave", () => { svgEl.classList.remove("focus"); svgEl.querySelectorAll(".hl").forEach(x => x.classList.remove("hl")); });
  });
  svgEl.querySelector(".node.group")?.addEventListener("click", () => switchView("accounts"));
  bindSelection();
}

/* ---------------- inspector ---------------- */
function props(rows){ return `<dl class="props">${rows.filter(Boolean).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`; }
function inspect(kind, id){
  const d = state.case; if (!d || !kind || !id) return;
  $("#workspace").classList.add("inspector-open");
  let html = "";
  if (kind === "account"){
    const h = allAccounts(d).find(x => x.ref === id || x.account_id === id);
    if (h){
      const st = accountStatus(d, h);
      const recs = (d.evidence_records || []).filter(r => r.account_id === h.account_id);
      html = `<h3 class="insp-title">${esc(h.platform || "")} · ${esc(h.ref)}</h3>` + props([
        ["Status", `<span class="st ${st === "linked" ? "ok" : st === "open" ? "warn" : "bad"}">${st}</span>`],
        ["Profile", `<a href="${esc(h.canonical_url || h.url)}" target="_blank" rel="noopener">${esc(short(h.canonical_url || h.url))}</a>`],
        h.display_name && ["Display name", esc(clean(h.display_name))],
        ["Handle", esc(h.matched_handle || "—")],
        ["Found via", esc(h.discovery_source || "—")],
        ["Verdict", esc(h.verdict || "unresolved")],
      ]);
      if (h.bio) html += `<div class="quote">${esc(clean(h.bio))}<small>profile bio (first-party)</small></div>`;
      html += recs.slice(0, 8).map(r => `<div class="quote">${esc(clean(r.excerpt || r.claim || ""))}<small>${esc(exhibitNo(d, r.id))} · ${esc(r.extraction_method || "")} · ${esc(String(r.retrieved_at || "").slice(0, 10))}</small></div>`).join("");
      html += `<div class="acts">${["evidence", "verify", "follow", "deepen", "keep", "discard"].map(c => `<button class="tbtn" type="button" onclick="send('${c} ${esc(h.ref)}')">${c[0].toUpperCase() + c.slice(1)}</button>`).join("")}</div>`;
    }
  } else if (kind === "source"){
    const s = (d.sources || []).find(x => x.id === id);
    if (s){
      html = `<h3 class="insp-title">${esc(clean(s.title || short(s.url)))}</h3>` + props([
        ["URL", `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(short(s.url))}</a>`],
        ["Outcome", esc(s.outcome === "found" ? "read" : s.outcome)],
        ["Found via", esc(s.via || "—")], ["Type", esc(s.content_type || "—")],
        ["Retrieved", esc(String(s.retrieved_at || "").slice(0, 16).replace("T", " "))],
      ]);
      if (s.extra?.snippet_only) html += `<div class="quote">${esc(clean(s.extra.snippet || s.extra.search_title || ""))}<small>search snippet — unverified lead, not evidence</small></div>`;
      if (s.excerpt) html += `<div class="quote">${esc(clean(s.excerpt))}<small>page excerpt</small></div>`;
      html += `<div class="acts"><button class="tbtn" type="button" onclick="send('read ${esc(s.url)}')">Re-read</button>
        <button class="tbtn" type="button" onclick="send('archive ${esc(s.url)}')">Archive history</button></div>`;
    }
  } else if (kind === "evidence"){
    const r = (d.evidence_records || []).find(x => x.id === id);
    if (r){
      html = `<h3 class="insp-title">${esc(exhibitNo(d, r.id))} · ${esc(humanClaim(r.claim))}</h3>` + props([
        ["Source", `<a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(short(r.source_url))}</a>`],
        ["Method", esc(r.extraction_method || "—")],
        ["Kind", esc(r.kind === "user_statement" ? "analyst statement" : r.supports ? "supports" : "clue")],
        ["Captured", esc(String(r.retrieved_at || "").slice(0, 16).replace("T", " "))],
        r.source_event_time && ["Event date", esc(r.source_event_time)],
        ["Record", `<span class="mono">${esc(r.id)}</span>`],
      ]) + `<div class="quote">${esc(clean(r.excerpt || String(r.value ?? "")))}</div>` +
        (r.limitation ? `<p class="faint" style="font-size:12px">${esc(r.limitation)}</p>` : "");
    }
  }
  $("#inspBody").innerHTML = html || `<div class="empty">Not found in this case.</div>`;
  if (html){ $("#inspBody").insertAdjacentHTML("beforeend", `<div id="traceBox"></div>`); loadTrace(id); }
}
async function loadTrace(ref){
  const box = $("#traceBox");
  if (!box || !state.caseId) return;
  try {
    const r = await (await fetch(`/api/case/${encodeURIComponent(state.caseId)}/trace?ref=${encodeURIComponent(ref)}` + (presenter ? "&redact=1" : ""))).json();
    if (!r.steps || !r.steps.length){ box.innerHTML = `<div class="trace-h">How this was found</div><div class="faint" style="font-size:12px">${esc(r.note || "No recorded path.")}</div>`; return; }
    box.innerHTML = `<div class="trace-h">How this was found</div><ol class="trace">` + r.steps.map(s =>
      `<li><b>${esc(s.type.replaceAll("_", " "))}</b> <span class="faint">· ${esc(s.origin)}</span>
        <code>${esc(s.query ? s.query : short(s.url))}${s.results != null ? ` — ${s.results} result(s)` : ""}</code></li>`).join("") +
      `<li class="end"><b>${esc(clean(r.item.label))}</b></li></ol>`;
  } catch (e) { box.innerHTML = ""; }
}
function bindSelection(){
  $$("[data-sel]").forEach(el => {
    if (el._bound || !el.dataset.sel) return;
    el._bound = true;
    if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "0");
    const activate = () => {
      $$(".selected").forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
      const [kind, ...rest] = el.dataset.sel.split(":");
      inspect(kind, rest.join(":"));
    };
    el.addEventListener("click", activate);
    el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); activate(); } });
  });
}
window.send = function(text){
  if (!text || state.busy) return;
  if (/^agent\b/i.test(text.trim())){ state.agentLive = []; state._switchedToLog = false; }
  feedLine("CMD", text, "", "plan");
  streamCommand(text, state.caseId);
};

function showLaunchWorkspace(target){
  $("#hero").hidden = true; $("#workspace").hidden = false;
  $("#casebar").hidden = false; $("#composer").hidden = false;
  $("#caseNo").textContent = "new case";
  $("#caseTitle").textContent = target;
  $("#view-profile").innerHTML = `<div class="empty launch">Looking for public information about <b>${esc(target)}</b>. Facts appear here as they are found.</div>`;
  switchView("profile");
  feedLine("OPEN", `case opened: ${target}`, "", "plan");
}

/* ---------------- wiring ---------------- */
$("#startForm").addEventListener("submit", e => {
  e.preventDefault();
  const target = $("#startTarget").value.trim();
  if (!target || state.busy) return;
  const on = $("#presetOpts button.on");
  const preset = on?.dataset.preset || "standard";
  const mode = on?.dataset.mode === "accounts" ? "accounts" : "full";
  const context = $("#startContext").value.split(",").map(s => s.trim()).filter(Boolean);
  $("#feedList").innerHTML = ""; state.logCount = 0;
  state.caseId = null; state.case = null; state.agentLive = [];
  state.seenNodes = new Set(); state.seenExhibits = new Set(); state.seenFacts = new Set(); state.lastStamp = "";
  Object.keys(state.counters).forEach(k => state.counters[k] = 0);
  renderCounters(false);
  showLaunchWorkspace(target);
  setBusy(true);
  const q = new URLSearchParams({target, mode, preset});
  q.set("exact_name", $("#exactName").checked ? "1" : "0");
  q.set("guided", $("#guidedMode").checked ? "1" : "0");
  if (presenter) q.set("redact", "1");
  context.forEach(c => q.append("context", c));
  if (state.es) state.es.close();
  state.es = new EventSource("/api/investigate?" + q);
  state.es.onmessage = ev => {
    const {kind, payload} = JSON.parse(ev.data);
    handleEvent(kind, payload);
    if (["done", "cancelled"].includes(kind) && state.es){ state.es.close(); state.es = null; }
  };
  state.es.onerror = () => { feedLine("ERROR", "stream dropped — reopen the case to continue", "", "error"); setBusy(false);
    if (state.es){ state.es.close(); state.es = null; } };
});
$("#presetOpts").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $$("#presetOpts button").forEach(x => x.classList.remove("on")); b.classList.add("on");
});
$("#tabs").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) switchView(t.dataset.view); });
$("#cmdform").addEventListener("submit", e => {
  e.preventDefault();
  const input = $("#cmdtext"); const t = input.value.trim();
  if (t){ send(t); input.value = ""; }
});
$("#hints").addEventListener("click", e => { const b = e.target.closest("button[data-cmd]"); if (b) send(b.dataset.cmd); });
$("#caseSelect").addEventListener("change", e => openCase(e.target.value));
$("#btnNew").addEventListener("click", () => {
  $("#workspace").hidden = true; $("#casebar").hidden = true; $("#composer").hidden = true;
  $("#hero").hidden = false; $("#caseSelect").value = ""; loadCases(); $("#startTarget").focus();
});
$("#inspClose").addEventListener("click", () => $("#workspace").classList.remove("inspector-open"));
$("#btnAgent").addEventListener("click", () => send("agent"));
$("#btnPause").addEventListener("click", () => control("pause"));
$("#btnStop").addEventListener("click", () => control("stop"));
$("#moreNav").addEventListener("click", e => { const b = e.target.closest("button[data-sub]"); if (b) switchView(b.dataset.sub); });
async function control(action){
  if (!state.caseId) return;
  try {
    const res = await fetch("/api/case/" + encodeURIComponent(state.caseId) + "/control", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({action})});
    const data = await res.json();
    feedLine(action === "stop" ? "STOP" : "PAUSE", data.message || action, "", "warn");
    if (action === "stop"){ setBusy(false); refreshCase(); }
  } catch (e) {}
}
const VIEWS = ["profile", "accounts", "exhibits", "sources", "more"];
document.addEventListener("keydown", e => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (e.key === "/" && !typing){ e.preventDefault(); $("#cmdtext").focus(); }
  if (!typing && e.key >= "1" && e.key <= "5" && state.case) switchView(VIEWS[+e.key - 1]);
  if (e.key === "Escape") $("#workspace").classList.remove("inspector-open");
});
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (currentView === "more" && currentSub === "chart") renderChart(); drawLeaders(false); }, 150); });

/* boot */
loadProviders(); loadCases();
const initial = new URLSearchParams(location.search).get("case");
if (initial) openCase(initial);
const initialView = new URLSearchParams(location.search).get("view");
if (initialView && (VIEWS.includes(initialView) || SUBS.includes(initialView))) switchView(initialView);
</script>
</body>
