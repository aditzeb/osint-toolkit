[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snoop-osint"
version = "2.1.0"
description = "Conservative, evidence-linked public profile research for consented investigations"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SNOOP contributors"}]
keywords = ["osint", "username", "investigation", "ai", "identity"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0", "ruff>=0.1.0"]
pdf = ["pypdf>=4.0.0"]
ocr = ["pytesseract>=0.3.10", "Pillow>=10.0.0"]

[project.scripts]
snoop = "snoop.cli:main"

[tool.setuptools.packages.find]
include = ["snoop*"]
exclude = ["tests*", "scripts*", "legacy*"]

[tool.setuptools.package-data]
snoop = ["data/*.json", "data/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Network/provider boundaries intentionally convert third-party failures into
# explicit unavailable states instead of crashing an investigation.
ignore = ["BLE001", "S110", "S112", "DTZ004"]
